<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Skyline Careers - Admin Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet"/>
  <style>body { font-family: 'Plus Jakarta Sans', sans-serif; }</style>
</head>
<body class="bg-gray-100 min-h-screen p-4 max-w-lg mx-auto">

  <header class="bg-white p-4 rounded-xl shadow-sm border mb-4 flex justify-between items-center">
    <div>
      <h1 class="font-bold text-base text-[#006194]">Admin Dashboard</h1>
      <p class="text-xs text-gray-500">Skyline Careers Vapi</p>
    </div>
    <span class="text-xs bg-blue-50 text-[#006194] px-2 py-1 rounded font-bold">Admin Portal</span>
  </header>

  <!-- Login Form -->
  <div id="login-box" class="bg-white p-5 rounded-2xl shadow-sm border space-y-4">
    <h2 class="font-bold text-sm text-gray-800">Enter Admin Password</h2>
    <input type="password" id="admin-pass" placeholder="Enter Password" class="w-full p-2.5 border rounded-lg text-sm focus:outline-none focus:border-[#006194]"/>
    <button onclick="checkPass()" class="w-full bg-[#006194] text-white font-bold py-2.5 rounded-lg text-sm">Login</button>
  </div>

  <!-- Admin Panel Content (Hidden initially) -->
  <div id="admin-panel" class="hidden space-y-4">
    
    <!-- Add Job Form -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h2 class="font-bold text-sm text-gray-800 border-b pb-2">Post New Job Vacancy</h2>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Job Title</label>
        <input type="text" id="job-title" placeholder="e.g. Heavy Driver, Welder, Helper" class="w-full p-2 border rounded-lg text-xs"/>
      </div>
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">Country</label>
          <select id="job-country" class="w-full p-2 border rounded-lg text-xs">
            <option>Dubai (UAE)</option>
            <option>Saudi Arabia</option>
            <option>Qatar</option>
            <option>Kuwait</option>
            <option>Europe</option>
            <option>USA</option>
          </select>
        </div>
        <div>
          <label class="text-xs font-semibold text-gray-600 block mb-1">Sector</label>
          <input type="text" id="job-sector" placeholder="e.g. Transport, Hotel" class="w-full p-2 border rounded-lg text-xs"/>
        </div>
      </div>
      <div>
        <label class="text-xs font-semibold text-gray-600 block mb-1">Description / Salary Details</label>
        <textarea id="job-desc" placeholder="Salary, duty hours, accommodation details..." class="w-full p-2 border rounded-lg text-xs h-20"></textarea>
      </div>
      <button onclick="postJob()" id="post-btn" class="w-full bg-[#006194] text-white font-bold py-2.5 rounded-lg text-xs shadow">Publish Job</button>
    </div>

    <!-- Live Posted Jobs -->
    <div class="bg-white p-4 rounded-2xl shadow-sm border space-y-3">
      <h2 class="font-bold text-sm text-gray-800">Manage Active Vacancies</h2>
      <div id="admin-jobs-list" class="space-y-2">
        <p class="text-xs text-gray-400">Loading...</p>
      </div>
    </div>

  </div>

  <script>
    const SUPABASE_URL = "https://vhxfybcrpjarwocpbelc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_UTayZu405y7fcwFilXwJqA_ZtfE_XxD";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // Default password (Change if needed)
    const SECRET_PASS = "skyline123";

    function checkPass() {
      const p = document.getElementById('admin-pass').value;
      if (p === SECRET_PASS) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('admin-panel').classList.remove('hidden');
        loadAdminJobs();
      } else {
        alert('Incorrect Password!');
      }
    }

    async function postJob() {
      const title = document.getElementById('job-title').value.trim();
      const country = document.getElementById('job-country').value;
      const sector = document.getElementById('job-sector').value.trim();
      const description = document.getElementById('job-desc').value.trim();

      if (!title) { alert('Please enter Job Title'); return; }

      const btn = document.getElementById('post-btn');
      btn.innerText = 'Publishing...';
      btn.disabled = true;

      const { error } = await _supabase.from('jobs').insert([{ title, country, sector, description }]);

      if (error) {
        alert('Error posting job: ' + error.message);
      } else {
        alert('Job Posted Successfully!');
        document.getElementById('job-title').value = '';
        document.getElementById('job-sector').value = '';
        document.getElementById('job-desc').value = '';
        loadAdminJobs();
      }
      btn.innerText = 'Publish Job';
      btn.disabled = false;
    }

    async function loadAdminJobs() {
      const container = document.getElementById('admin-jobs-list');
      const { data: jobs, error } = await _supabase.from('jobs').select('*').order('created_at', { ascending: false });

      if (error || !jobs || jobs.length === 0) {
        container.innerHTML = '<p class="text-xs text-gray-400">No active jobs.</p>';
        return;
      }

      container.innerHTML = jobs.map(j => `
        <div class="flex items-center justify-between p-2.5 bg-gray-50 border rounded-lg">
          <div>
            <p class="font-bold text-xs text-gray-800">${j.title}</p>
            <p class="text-[10px] text-gray-500">${j.country} • ${j.sector || 'General'}</p>
          </div>
          <button onclick="deleteJob(${j.id})" class="text-red-600 bg-red-50 hover:bg-red-100 p-1.5 rounded text-xs font-bold">Delete</button>
        </div>
      `).join('');
    }

    async function deleteJob(id) {
      if (!confirm('Are you sure you want to delete this job?')) return;
      await _supabase.from('jobs').delete().eq('id', id);
      loadAdminJobs();
    }
  </script>
</body>
</html>
